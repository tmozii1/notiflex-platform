name: Notiflex API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "deploy/k8s/**"
      - ".github/workflows/notiflex-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/notiflex-api-ci.yml"
  workflow_dispatch:

concurrency:
  group: notiflex-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: tim-gitaiops-project
  REGION: asia-northeast3
  IMAGE_HOST: asia-northeast3-docker.pkg.dev
  ARTIFACT_REPOSITORY: notiflex
  IMAGE_NAME: notiflex-api
  DEPLOYMENT_FILE: deploy/k8s/deployment.yaml

jobs:
  test:
    name: Test Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Run tests
        run: go test ./...

  build-and-update-manifest:
    name: Build image and update manifest
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          image_tag="git-${short_sha}"
          image_uri="${IMAGE_HOST}/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${image_uri}" >> "${GITHUB_OUTPUT}"
          echo "image=${image_uri}:${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Update Kubernetes manifest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["DEPLOYMENT_FILE"])
          image = os.environ["IMAGE"]
          image_tag = os.environ["IMAGE_TAG"]

          lines = path.read_text().splitlines()
          output = []
          current_env_name = ""

          for line in lines:
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]

              if stripped.startswith("- name: "):
                  current_env_name = stripped.split(":", 1)[1].strip()

              if stripped.startswith("image: ") and "notiflex-api:" in stripped:
                  output.append(f"{indent}image: {image}")
                  continue

              if current_env_name == "APP_VERSION" and stripped.startswith("value: "):
                  output.append(f'{indent}value: "{image_tag}"')
                  current_env_name = ""
                  continue

              output.append(line)

          path.write_text("\n".join(output) + "\n")
          PY

      - name: Commit manifest update
        run: |
          if git diff --quiet -- "${DEPLOYMENT_FILE}"; then
            echo "No manifest change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEPLOYMENT_FILE}"
          git commit -m "chore: deploy notiflex-api ${{ steps.meta.outputs.image_tag }}"
          git push origin HEAD:main
